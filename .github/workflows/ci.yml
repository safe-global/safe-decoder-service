name: Python CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
  release:
    types: [ released ]

# Main runs queue rather than cancel, so a deploy is never cut off mid-merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  PYTHON_VERSION: "3.14"

jobs:
  linting:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --group dev --frozen --no-install-project
      - name: Run pre-commit
        run: uv run pre-commit run --all-files
        env:
          SKIP: mypy,insert-license

  test-app:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmqctl await_startup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install dependencies
      run: uv sync --group dev --frozen --no-install-project
    - name: Run database migrations
      run: uv run alembic upgrade head
      env:
        ENV_FILE: .env.test
    - name: Run mypy
      run: uv run mypy .
    - name: Run tests and coverage
      run: uv run coverage run --source=$SOURCE_FOLDER -m pytest -rxXs
      env:
        SOURCE_FOLDER: app
        ENV_FILE: .env.test
    - name: Send results to coveralls
      continue-on-error: true  # Ignore coveralls problems
      run: uv run coveralls --service=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Required for coveralls

  docker-deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || (github.event_name == 'release' && github.event.action == 'released')
    needs:
      - linting
      - test-app
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read
      packages: write
      id-token: write  # Sign provenance attestations and cache entries
    with:
      output: image
      push: true
      file: docker/web/Dockerfile
      platforms: linux/amd64,linux/arm64
      build-args: |
        BUILD_COMMIT=${{ github.sha }}
      cache: true
      cache-mode: max
      meta-images: |
        safeglobal/safe-decoder-service
        ghcr.io/safe-global/safe-decoder-service
      # deploy-devstaging reads the tag from this rule: keep it the only one enabled on main.
      meta-tags: |
        type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
        type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
        type=raw,value=latest,enable=${{ github.event_name == 'release' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        - registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  deploy-devstaging:
    needs: [docker-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: devstaging
      image: ${{ fromJSON(needs.docker-deploy.outputs.meta-json)['tag-names'][0] }}@${{ needs.docker-deploy.outputs.digest }}
      values_file: apps/safe-decoder-service/values-devstaging.yaml
      base_url: https://api.5afe.dev/decoder
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
