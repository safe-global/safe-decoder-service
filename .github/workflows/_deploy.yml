name: _deploy
on:
  workflow_call:
    inputs:
      environment:
        description: devstaging or production
        type: string
        required: true
      image:
        description: Image tag and digest, e.g. v1.20.0@sha256:...
        type: string
        required: true
      values_file:
        type: string
        required: true
      base_url:
        description: Public URL prefix of the service, e.g. https://api.safe.global/decoder
        type: string
        required: true
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

permissions: {}

jobs:
  deploy:
    permissions: {}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check the image reference
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^(main-[0-9a-f]{7}|v[0-9]+\.[0-9]+\.[0-9]+)@sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::Refusing to deploy '${IMAGE}'"; exit 1; }

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: safe-global
          repositories: safe-decoder-service-infra-tf
          permission-contents: write
          permission-pull-requests: write

      # The values file is private and these logs are public: never print it.
      - name: Open and merge the deploy PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          IMAGE: ${{ inputs.image }}
          ENVIRONMENT: ${{ inputs.environment }}
          FILE: ${{ inputs.values_file }}
          REPO: safe-global/safe-decoder-service-infra-tf
        run: |
          set -euo pipefail
          TAG="${IMAGE%@*}"
          BRANCH="deploy/${ENVIRONMENT}/safe-decoder-service-${TAG}"
          TITLE="deploy(${ENVIRONMENT}): safe-decoder-service ${TAG}"

          main_sha() { gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha; }
          fetch_values() {
            gh api "repos/${REPO}/contents/${FILE}?ref=$1" > file.json
            jq -r .content file.json | base64 -d > values.yaml
            # yq exits 0 on an empty file and would write back a file with only the tag.
            yq -e '.nameOverride == "safe-decoder-service"' values.yaml > /dev/null
          }
          # Points the branch at $1 (main) and writes the new tag on top of it.
          write_branch() {
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$1" --silent 2>/dev/null \
              || gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" -f sha="$1" -F force=true --silent
            # apm.version is Datadog's version tag; it must match the image tag.
            TAG="$TAG" yq '.image.tag = strenv(IMAGE) | with(select(has("apm")); .apm.version = strenv(TAG))' values.yaml \
              | base64 -w0 > content.b64
            gh api -X PUT "repos/${REPO}/contents/${FILE}" \
              -f message="$TITLE" \
              -F content=@content.b64 \
              -f sha="$(jq -r .sha file.json)" \
              -f branch="$BRANCH" \
              --silent
          }

          BASE=$(main_sha)
          fetch_values "$BASE"
          if [ "$(yq -r .image.tag values.yaml)" = "$IMAGE" ]; then
            echo "${ENVIRONMENT} already runs ${TAG}"
            exit 0
          fi
          write_branch "$BASE"
          PR_URL=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          [ -n "$PR_URL" ] || PR_URL=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$TITLE" \
            --body "Automated deploy from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")

          # Merge with --admin (safe-ci's ruleset bypass) and retry: GitHub can refuse a merge right after the push.
          for attempt in $(seq 1 8); do
            gh pr merge "$PR_URL" --repo "$REPO" --squash --admin --delete-branch --subject "$TITLE" --body "" && break
            [ "$(gh pr view "$PR_URL" --repo "$REPO" --json state --jq .state)" = MERGED ] && break
            [ "$attempt" -eq 8 ] && { echo "::error::Could not merge ${PR_URL}"; exit 1; }
            sleep 20
            # main moved (another deploy or a values change): rebuild the branch on top of it.
            NEW=$(main_sha)
            if [ "$NEW" != "$BASE" ]; then
              BASE="$NEW"
              fetch_values "$BASE"
              write_branch "$BASE"
            fi
          done
          echo "Deployed ${TAG} to ${ENVIRONMENT}: ${PR_URL}"

      # The readiness probe is /health/ready, so a pod that reports the new build on /about is already ready.
      - name: Wait for the new build
        env:
          IMAGE: ${{ inputs.image }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          get() { curl -sS -o body.json -w '%{http_code}' --max-time 10 "${BASE_URL}$1" || echo 000; }

          TAG="${IMAGE%@*}"
          # Releases report .version; main builds report the full commit, so match its prefix.
          live() {
            if [[ "$TAG" == v* ]]; then
              [ "$(jq -r '.version // empty' body.json)" = "${TAG#v}" ]
            else
              [[ "$(jq -r '.buildCommit // empty' body.json)" == "${TAG#main-}"* ]]
            fi
          }
          deadline=$((SECONDS + 900))
          until [ "$(get /api/v1/about)" = 200 ] && live; do
            [ "$SECONDS" -ge "$deadline" ] && { echo "::error::${BASE_URL}/api/v1/about did not report ${TAG} within 15 minutes"; exit 1; }
            sleep 15
          done
          echo "${TAG} is live"
